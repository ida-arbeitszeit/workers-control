{% macro copy_toggle(value) %}
<label data-type="copy-toggle" class="is-clickable">
    <input
        type="button"
        alt="Copy to clipboard"
        value="{{ value }}"
        class="is-hidden"
    >
    <span class="icon" aria="hidden">
        {{ "copy"|icon }}
        <template>
        {{ "check"|icon }}
        </template>
    </span>
</label>
{% endmacro %}
