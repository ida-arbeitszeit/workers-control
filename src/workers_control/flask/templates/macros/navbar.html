{% macro navbar(navbar_items) %}
    {% for navbar_item in navbar_items %}
        {% if navbar_item.url is not none %}
        <li><a href="{{ navbar_item.url }}">{{ navbar_item.text }}</a></li>
        {% else %}
        <li class="is-active"><a aria-current="page" class="has-text-dark">{{ navbar_item.text }}</a></li>
        {% endif %}
    {% endfor %}
{% endmacro %}
